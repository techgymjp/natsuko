name: iOS release (TestFlight)

# 既定ブランチに push するたびに、本番広告の設定で iOS 版をビルドし、
# 署名して App Store Connect(TestFlight)にアップロードする。審査への提出は App Store Connect で行う。
# 必要な Secrets(docs/IOS_BUILD.md の 7 章):
#   IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

# アップロードの途中で止めないよう、新しい push が来ても前の実行は最後まで走らせる
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
      TEAM_ID: GNM3VTX9YG
    steps:
      - name: Stop if the secrets are missing
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::iOS の Secrets が登録されていないので、アップロードしません(docs/IOS_BUILD.md の 7 章)"

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        timeout-minutes: 5
        run: npm ci

      # ビルド番号は実行回数に 100 を足したもの(手元の Mac から手でアップロードする 1〜99 とぶつからないように)
      - name: Set version name and build number
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      # App Store 用は本番の広告 ID(ios:release と同じ)
      - name: Copy web assets into the iOS project (production ads)
        if: env.HAS_SECRETS == 'true'
        env:
          ADMOB_MODE: production
        run: |
          VERSION_CODE="$BUILD_NUMBER" npm run build
          npx cap sync ios

      - name: Install the distribution certificate
        if: env.HAS_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # プロファイルを探すために、証明書のシリアル番号を控える
          SERIAL=$(security find-certificate -a -c "Distribution" -p "$KEYCHAIN" | openssl x509 -noout -serial | cut -d= -f2)
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: env.HAS_SECRETS == 'true'
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # App Store 用のプロビジョニングプロファイルを API キーで用意する(なければ作る)。
      # 新しい証明書は作らない(作れる証明書の数には上限があるため、登録した配布用証明書だけを使う)
      - name: Prepare the App Store provisioning profile
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" scripts/ios-profile.py "$BUNDLE_ID" "$CERT_SERIAL"

      # 配布用証明書とプロファイルを指定して署名する(手動署名)。
      # コマンドラインで指定するとライブラリ(Swift Package)にも効いて失敗するので、アプリのターゲットの設定だけを書き換える
      - name: Archive
        if: env.HAS_SECRETS == 'true'
        working-directory: ios/App
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os, re
          p = 'App.xcodeproj/project.pbxproj'
          s = open(p).read()
          bid = os.environ['BUNDLE_ID']
          def fix(m):
              block = m.group(0)
              if f'PRODUCT_BUNDLE_IDENTIFIER = {bid};' not in block:
                  return block
              block = block.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              add = (f'\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
                     f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";\n')
              return block.replace('buildSettings = {\n', 'buildSettings = {\n' + add, 1)
          s2 = re.sub(r'buildSettings = \{\n.*?\n\t\t\t\};', fix, s, flags=re.S)
          assert s2 != s, 'app target build settings not found'
          open(p, 'w').write(s2)
          PY
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$VERSION_NAME" \
            archive | tail -60
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: Upload to App Store Connect (TestFlight)
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${VERSION_NAME} (${BUILD_NUMBER}). It appears in TestFlight after Apple finishes processing (10-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the keychain and key
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
