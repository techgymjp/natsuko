<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>司令塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="歴史上の危機で司令塔の椅子に座り、極限の判断を鍛えるゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 薄暗い作戦室。計器のパネルはスレート、入電は紙のテレタイプ、合図の色は琥珀だけ。 */
:root {
  --room: #11161d;
  --console: #19212b;
  --console-2: #212b37;
  --rule: #313d4c;
  --text: #e6e2d8;
  --dim: #929cab;
  --amber: #f0aa32;
  --amber-ink: #1b1305;
  --amber-soft: rgba(240, 170, 50, .13);
  --signal: #e2574a;
  --signal-soft: rgba(226, 87, 74, .14);
  --go: #62bb8f;
  --go-soft: rgba(98, 187, 143, .14);
  --cool: #86b6de;
  --paper: #eee6d3;
  --paper-2: #e3d8bf;
  --paper-ink: #2b261d;
  --paper-dim: #6f6552;
  --f-display: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--room);
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--room); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { padding-block: 28px 64px; }

/* 上部バー */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(17, 22, 29, .94);
  border-bottom: 1px solid var(--rule);
  backdrop-filter: blur(6px);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .12em; background: none; border: 0; padding: 0; }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--dim); margin-left: 8px; font-weight: 400; }
.topbar .spacer { flex: 1; }

/* 部品 */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 20px;
  border-radius: var(--radius); border: 1px solid var(--amber);
  background: var(--amber); color: var(--amber-ink);
  font-weight: 700; letter-spacing: .06em;
  transition: transform .12s, background .12s, opacity .12s;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--amber); color: var(--amber); }
a.btn { text-decoration: none; }
.share { padding: 16px; display: grid; gap: 10px; }
.share-text { white-space: pre-wrap; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.btn.danger { border-color: var(--signal); color: var(--signal); background: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--dim); white-space: nowrap; }
.chip.ok { color: var(--go); border-color: var(--go); background: var(--go-soft); }
.chip.ng { color: var(--signal); border-color: var(--signal); background: var(--signal-soft); }
.chip.amber { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.panel { background: var(--console); border: 1px solid var(--rule); border-radius: var(--radius); }
.muted { color: var(--dim); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 12px; }

/* タイトル */
#s-title { min-height: calc(100vh - 40px); display: grid; align-content: center; }
.hero { display: grid; gap: 28px; max-width: 820px; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 16vw, 168px); line-height: 1; letter-spacing: .08em; }
.hero h1 .dot { color: var(--amber); }
.hero .lede { font-size: clamp(16px, 2.4vw, 19px); max-width: 38em; color: var(--text); }
.ticker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.ticker div { padding: 10px 12px 10px 0; font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.ticker b { display: block; font-family: var(--f-body); color: var(--text); font-weight: 500; font-size: 13px; }
.callsign { display: grid; gap: 6px; max-width: 320px; }
.callsign input { background: var(--console); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; min-height: 44px; }
.note { font-size: 12px; color: var(--dim); }

/* 作戦室(ハブ) */
.hub-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.hub-head h2 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 36px); }
.hub-grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.sc-card {
  text-align: left; padding: 18px; display: grid; gap: 8px; align-content: start;
  background: var(--console); border: 1px solid var(--rule); border-radius: var(--radius);
  transition: border-color .15s, transform .15s;
}
.sc-card:hover { border-color: var(--amber); transform: translateY(-2px); }
.sc-card .yr { font-family: var(--f-mono); font-size: 12px; color: var(--amber); letter-spacing: .1em; }
.sc-card h3 { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.sc-card .sub { color: var(--dim); font-size: 13px; }
.sc-card .role { font-size: 13px; border-top: 1px dashed var(--rule); padding-top: 8px; }
.sc-card .foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 1px; background: var(--rule); display: block; }
.pips i.on { background: var(--amber); }
.side { display: grid; gap: 14px; }
.side .panel { padding: 16px; display: grid; gap: 10px; }
.side h3 { font-family: var(--f-display); font-size: 18px; }
.daily-card { border-color: var(--amber) !important; background: linear-gradient(160deg, var(--amber-soft), transparent 70%), var(--console) !important; }
.streak { font-family: var(--f-mono); font-size: 28px; color: var(--amber); line-height: 1; }
.vol { display: grid; grid-template-columns: 4.5em 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
input[type=range] { accent-color: var(--amber); width: 100%; }

/* ブリーフィング */
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.brief-title { font-family: var(--f-display); font-size: clamp(34px, 6vw, 58px); line-height: 1.15; margin: 8px 0 6px; }
.brief-sub { color: var(--amber); font-family: var(--f-display); font-size: 18px; }
.teletype { margin-top: 24px; display: grid; gap: 14px; font-size: 17px; max-width: 34em; min-height: 12em; }
.teletype p { border-left: 2px solid var(--rule); padding-left: 14px; }
.dossier { padding: 18px; display: grid; gap: 14px; }
.dossier h3 { font-family: var(--f-display); font-size: 17px; }
.kv { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; }
.adv-mini { display: grid; gap: 8px; }
.adv-mini div { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; font-size: 13px; }

/* 局面 */
.turn-head {
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.3fr) auto; gap: 20px; align-items: center;
  padding: 16px 18px; margin-bottom: 18px;
}
.turn-head h2 { font-family: var(--f-display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; }
.clock { font-family: var(--f-mono); color: var(--amber); font-size: 13px; letter-spacing: .06em; }
.meters { display: grid; gap: 8px; }
.meter { display: grid; grid-template-columns: 8.5em 1fr 2.4em; gap: 10px; align-items: center; font-size: 12px; }
.meter .bar { height: 8px; background: var(--console-2); border-radius: 2px; overflow: hidden; position: relative; }
.meter .bar span { position: absolute; inset: 0 auto 0 0; background: var(--amber); transition: width .8s cubic-bezier(.2,.8,.2,1), background .3s; }
.meter .bar span.low { background: var(--signal); }
.meter .bar span.high { background: var(--go); }
.meter .val { font-family: var(--f-mono); text-align: right; color: var(--dim); }
.timer { position: relative; width: 92px; height: 92px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 26px; font-weight: 600; }
.timer .num small { display: block; font-size: 9px; letter-spacing: .2em; color: var(--dim); font-weight: 400; margin-top: -26px; }
.timer.urgent .num { color: var(--signal); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.turn-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.sit { font-size: 16px; line-height: 1.85; padding: 18px; }
.col { display: grid; gap: 14px; min-width: 0; }
.section-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.reports { display: grid; gap: 12px; }
.report {
  position: relative;
  background: var(--paper); color: var(--paper-ink);
  border-radius: 2px; padding: 16px 16px 14px;
  background-image: repeating-linear-gradient(transparent 0 27px, rgba(43, 38, 29, .07) 27px 28px);
  box-shadow: 0 1px 0 var(--paper-2), 0 8px 20px rgba(0,0,0,.25);
}
.report::before { content: ""; position: absolute; left: 0; right: 0; top: -5px; height: 10px; background: radial-gradient(circle at 5px 5px, var(--room) 3px, transparent 3.5px) 0 0 / 16px 10px repeat-x; }
.report .from { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--paper-dim); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.report .body { font-family: var(--f-body); font-size: 15px; margin-top: 6px; line-height: 1.75; min-height: 1.7em; }
.report .stampmark {
  position: absolute; right: 12px; bottom: 8px; transform: rotate(-9deg);
  border: 2px solid #b8382c; color: #b8382c; font-weight: 700; font-size: 13px; letter-spacing: .1em;
  padding: 2px 8px; border-radius: 3px; opacity: .88; background: rgba(238,230,211,.7);
}
.report.flagged { box-shadow: 0 0 0 2px #b8382c, 0 8px 20px rgba(0,0,0,.25); }
.inv-note { padding: 12px 14px; border: 1px dashed var(--cool); border-radius: var(--radius); color: var(--cool); font-size: 14px; }

.advisors { display: grid; gap: 12px; }
.adv { padding: 14px; display: grid; gap: 8px; }
.adv-top { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; }
.glyph { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 14px; border: 1.5px solid currentColor; }
.g-c { color: var(--cool); } .g-a { color: var(--signal); } .g-d { color: var(--amber); }
.adv-name { font-weight: 700; line-height: 1.3; }
.adv-name small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; }
.adv-rec { font-family: var(--f-mono); font-size: 12px; color: var(--text); text-align: right; }
.adv-rec b { font-size: 18px; color: var(--amber); }
.adv p { font-size: 14px; color: var(--text); }
.confbar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 11px; color: var(--dim); font-family: var(--f-mono); }
.confbar .bar { height: 4px; background: var(--console-2); border-radius: 2px; overflow: hidden; }
.confbar .bar span { display: block; height: 100%; background: currentColor; }

.decide { margin-top: 18px; padding: 18px; display: grid; gap: 16px; border-color: var(--amber); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.opt {
  text-align: left; padding: 14px; border-radius: var(--radius);
  background: var(--console-2); border: 1px solid var(--rule);
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-content: start;
  transition: border-color .12s, background .12s;
}
.opt:hover { border-color: var(--amber); }
.opt[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber); }
.opt .letter { font-family: var(--f-mono); font-size: 22px; font-weight: 600; color: var(--amber); line-height: 1.2; }
.opt .ol { font-weight: 700; line-height: 1.45; }
.opt .od { font-size: 13px; color: var(--dim); margin-top: 4px; line-height: 1.65; }
.decide-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 16px; align-items: end; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field label { color: var(--dim); }
.field input[type=text] { background: var(--console-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px; min-height: 40px; }
.conf-val { font-family: var(--f-mono); color: var(--amber); font-size: 16px; }
.kbd { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }

/* 決裁の結果(オーバーレイ) */
.overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(8, 11, 15, .82);
  display: grid; place-items: center; overflow-y: auto;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.verdict { width: min(640px, 100%); padding: 26px; display: grid; gap: 16px; position: relative; border-color: var(--amber); }
.big-stamp {
  justify-self: start; font-family: var(--f-display); font-weight: 800; font-size: 34px; letter-spacing: .3em;
  color: var(--signal); border: 3px double var(--signal); padding: 2px 6px 2px 16px; transform: rotate(-6deg);
  animation: stampIn .35s cubic-bezier(.3,1.6,.5,1) both;
}
.big-stamp.go { color: var(--amber); border-color: var(--amber); }
@keyframes stampIn { from { transform: scale(2.4) rotate(-6deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.verdict h3 { font-family: var(--f-display); font-size: 22px; }
.deltas { display: grid; gap: 6px; }
.delta { display: grid; grid-template-columns: 8.5em 1fr auto; gap: 10px; font-size: 13px; align-items: center; }
.delta .d { font-family: var(--f-mono); }
.d.plus { color: var(--go); } .d.minus { color: var(--signal); } .d.zero { color: var(--dim); }

/* 結末 */
.ending { max-width: 760px; display: grid; gap: 22px; padding-top: 6vh; }
.ending h1 { font-family: var(--f-display); font-size: clamp(40px, 8vw, 76px); line-height: 1.1; }
.ending .text { font-size: 18px; }
.epilogue { padding: 18px; border-left: 3px solid var(--amber); }

/* 振り返り */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 18px 0 22px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--dim); white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--amber); border-bottom-color: var(--amber); }
.scores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.score { padding: 14px; display: grid; gap: 2px; }
.score .n { font-family: var(--f-mono); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .l { font-size: 12px; color: var(--dim); }
.score .s { font-size: 12px; }
.review-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.review-grid .panel { padding: 18px; display: grid; gap: 12px; }
.review-grid h3 { font-family: var(--f-display); font-size: 18px; }
.quad { display: grid; grid-template-columns: 1.6em 1fr 1fr; grid-template-rows: 1fr 1fr 1.6em; gap: 4px; aspect-ratio: 1.25; max-width: 100%; position: relative; }
.quad .cell { border: 1px solid var(--rule); border-radius: 3px; padding: 8px; font-size: 12px; color: var(--dim); position: relative; }
.quad .cell b { display: block; color: var(--text); font-size: 13px; }
.quad .cell.on { border-color: var(--amber); background: var(--amber-soft); }
.quad .cell.on b { color: var(--amber); }
.quad .ax { font-size: 11px; color: var(--dim); display: grid; place-items: center; font-family: var(--f-mono); }
.quad .ax.y { writing-mode: vertical-rl; }
.quad .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); transform: translate(-50%, 50%); }
.radar { width: 100%; max-width: 420px; justify-self: center; }
.radar text { fill: var(--dim); font-size: 11px; font-family: var(--f-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
.spectrum { display: grid; gap: 4px; font-size: 12px; }
.spectrum .track { height: 6px; background: linear-gradient(90deg, var(--console-2), var(--rule), var(--console-2)); border-radius: 3px; position: relative; }
.spectrum .track i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); transform: translate(-50%, -50%); }
.spectrum .ends { display: flex; justify-content: space-between; color: var(--dim); }
.tendencies { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.tendencies li { padding-left: 16px; position: relative; }
.tendencies li::before { content: ""; position: absolute; left: 0; top: .75em; width: 7px; height: 7px; background: var(--amber); }

.tcards { display: grid; gap: 16px; }
.tcard { padding: 18px; display: grid; gap: 12px; }
.tcard-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.tcard-head h3 { font-family: var(--f-display); font-size: 20px; }
.compare2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.compare2 > div { background: var(--console-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 4px; align-content: start; }
.compare2 .who { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.compare2 .what { font-weight: 700; }
.qbar { display: inline-flex; gap: 3px; vertical-align: middle; }
.qbar i { width: 16px; height: 6px; border-radius: 1px; background: var(--rule); }
.qbar i.on { background: var(--amber); }
.reveal { display: grid; gap: 8px; font-size: 14px; }
.reveal .item { display: grid; grid-template-columns: 7em 1fr; gap: 10px; padding-top: 8px; border-top: 1px dashed var(--rule); }
.reveal .item b { color: var(--dim); font-weight: 500; font-size: 13px; }
.lesson { font-family: var(--f-display); font-size: 16px; color: var(--amber); }

.timeline { display: grid; gap: 0; }
.tl-head, .tl-row { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.tl-head { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.tl-row { padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.tl-row .when { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.tl-row .mine.diverge { color: var(--amber); }

.howto { max-width: 820px; display: grid; gap: 22px; }

@media (max-width: 900px) {
